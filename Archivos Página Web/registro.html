<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Feria La Salle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="LaSalleCSS.CSS">
</head>
<body class="bg-light">

  <nav class="navbar bg-azul-primario py-3 border-bottom border-warning border-3">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="login.html" id="link-volver-login">
        <i class="bi bi-arrow-left me-2 text-amarillo"></i>Volver a Iniciar Sesión
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-azul-outline" id="btn-idioma" onclick="cambiarIdioma()">ES / EN</button>
        <a href="index.html" class="btn btn-sm btn-amarillo" id="link-inicio">Página Principal</a>
      </div>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 750px;">

    <div class="card card-auth">
      <div class="card-auth-header text-center">
        <h3 class="fw-bold text-amarillo mb-1" id="reg-titulo">Formulario de Registro</h3>
        <p class="text-light small mb-0" id="reg-subtitulo">Selecciona el tipo de cuenta para unirte a la feria</p>
      </div>

      <div class="p-3 bg-light border-bottom">
        <ul class="nav nav-pills nav-fill nav-pills-amarillo" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active py-2" id="tab-usuario" data-bs-toggle="pill" data-bs-target="#panel-usuario" type="button" role="tab">
              <i class="bi bi-person me-2"></i><span id="tab-txt-usuario">Usuario / Invitado</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link py-2" id="tab-empresa" data-bs-toggle="pill" data-bs-target="#panel-empresa" type="button" role="tab">
              <i class="bi bi-building me-2"></i><span id="tab-txt-empresa">Empresa</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="card-body p-4 p-md-5">
        <div class="tab-content" id="pills-tabContent">

          <div class="tab-pane fade show active" id="panel-usuario" role="tabpanel">
            <h5 class="fw-bold text-primary mb-3" id="user-sec-titulo">Registro de Usuario / Invitado</h5>
            <form id="form-usuario" onsubmit="procesarRegistroUsuario(event)">
              <div class="mb-3">
                <label class="form-label fw-bold text-secondary" id="lbl-user-nom">Nombre Completo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="user-nombre" placeholder="Tu nombre y apellidos" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold text-secondary" id="lbl-user-email">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="user-correo" placeholder="correo@ejemplo.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold text-secondary" id="lbl-user-pass">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="user-password" placeholder="Mínimo 6 caracteres" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold text-secondary" id="lbl-user-foto">Foto de Perfil</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-image"></i></span>
                  <input type="file" class="form-control" id="user-foto" accept="image/*">
                </div>
                <small class="text-muted" id="txt-user-foto-tip">Elige una foto de perfil (JPG, PNG).</small>
              </div>

              <button type="submit" class="btn btn-amarillo w-100 py-3 fs-5 fw-bold" id="btn-submit-user">
                <i class="bi bi-check-lg me-1"></i>Registrarse e Iniciar Sesión
              </button>
            </form>
          </div>

          <div class="tab-pane fade" id="panel-empresa" role="tabpanel">
            <h5 class="fw-bold text-primary mb-3" id="emp-sec-titulo">Registro de Empresa</h5>
            <form id="form-empresa" onsubmit="procesarRegistroEmpresa(event)">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-nom">Nombre de la Empresa</label>
                  <input type="text" class="form-control" id="emp-nombre" placeholder="Ej. Innova Solutions" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-centro">Centro al que pertenecen</label>
                  <input type="text" class="form-control" id="emp-centro" placeholder="Ej. Campus Barcelona / Sede Central" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-loc">Localidad</label>
                  <input type="text" class="form-control" id="emp-localidad" placeholder="Ej. Zaragoza, Barcelona..." required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-tel">Teléfono</label>
                  <input type="tel" class="form-control" id="emp-telefono" placeholder="Ej. +34 600 000 000" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-email">Correo Electrónico Corporativo</label>
                  <input type="email" class="form-control" id="emp-correo" placeholder="contacto@empresa.com" required>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-pass">Contraseña</label>
                  <input type="password" class="form-control" id="emp-password" placeholder="Tu contraseña corporativa" required>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-desc">Pequeña Descripción de la Empresa</label>
                  <textarea class="form-control" id="emp-desc" rows="3" placeholder="Describe brevemente las actividades, proyectos o sector de la empresa..." required></textarea>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold text-secondary" id="lbl-emp-logo">Adjuntar Imagen del Logotipo</label>
                  <input type="file" class="form-control" id="emp-logo" accept="image/*">
                  <small class="text-muted" id="txt-emp-logo-tip">Formatos admitidos: PNG, JPG, SVG.</small>
                </div>
              </div>

              <div class="mt-4">
                <button type="submit" class="btn btn-amarillo w-100 py-3 fs-5 fw-bold" id="btn-submit-emp">
                  <i class="bi bi-building-check me-1"></i>Registrar Empresa e Iniciar Sesión
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let idiomaActual = localStorage.getItem("idiomaSeleccionado") || "es";

    function aplicarTraduccion(lang) {
      if (lang === "en") {
        document.getElementById("link-volver-login").innerHTML = '<i class="bi bi-arrow-left me-2 text-amarillo"></i>Back to Sign In';
        document.getElementById("link-inicio").innerText = "Main Page";
        document.getElementById("reg-titulo").innerText = "Registration Form";
        document.getElementById("reg-subtitulo").innerText = "Select your account type to join the fair";
        document.getElementById("tab-txt-usuario").innerText = "User / Guest";
        document.getElementById("tab-txt-empresa").innerText = "Company";
        document.getElementById("user-sec-titulo").innerText = "User / Guest Registration";
        document.getElementById("lbl-user-nom").innerText = "Full Name";
        document.getElementById("lbl-user-email").innerText = "Email Address";
        document.getElementById("lbl-user-pass").innerText = "Password";
        document.getElementById("lbl-user-foto").innerText = "Profile Picture";
        document.getElementById("txt-user-foto-tip").innerText = "Choose a profile photo (JPG, PNG).";
        document.getElementById("btn-submit-user").innerHTML = '<i class="bi bi-check-lg me-1"></i>Register and Sign In';
        document.getElementById("emp-sec-titulo").innerText = "Company Registration";
        document.getElementById("lbl-emp-nom").innerText = "Company Name";
        document.getElementById("lbl-emp-centro").innerText = "Affiliated Center";
        document.getElementById("lbl-emp-loc").innerText = "City / Locality";
        document.getElementById("lbl-emp-tel").innerText = "Phone Number";
        document.getElementById("lbl-emp-email").innerText = "Corporate Email";
        document.getElementById("lbl-emp-pass").innerText = "Password";
        document.getElementById("lbl-emp-desc").innerText = "Brief Company Description";
        document.getElementById("lbl-emp-logo").innerText = "Attach Logo Image";
        document.getElementById("txt-emp-logo-tip").innerText = "Accepted formats: PNG, JPG, SVG.";
        document.getElementById("btn-submit-emp").innerHTML = '<i class="bi bi-building-check me-1"></i>Register Company and Sign In';
      } else {
        document.getElementById("link-volver-login").innerHTML = '<i class="bi bi-arrow-left me-2 text-amarillo"></i>Volver a Iniciar Sesión';
        document.getElementById("link-inicio").innerText = "Página Principal";
        document.getElementById("reg-titulo").innerText = "Formulario de Registro";
        document.getElementById("reg-subtitulo").innerText = "Selecciona el tipo de cuenta para unirte a la feria";
        document.getElementById("tab-txt-usuario").innerText = "Usuario / Invitado";
        document.getElementById("tab-txt-empresa").innerText = "Empresa";
        document.getElementById("user-sec-titulo").innerText = "Registro de Usuario / Invitado";
        document.getElementById("lbl-user-nom").innerText = "Nombre Completo";
        document.getElementById("lbl-user-email").innerText = "Correo Electrónico";
        document.getElementById("lbl-user-pass").innerText = "Contraseña";
        document.getElementById("lbl-user-foto").innerText = "Foto de Perfil";
        document.getElementById("txt-user-foto-tip").innerText = "Elige una foto de perfil (JPG, PNG).";
        document.getElementById("btn-submit-user").innerHTML = '<i class="bi bi-check-lg me-1"></i>Registrarse e Iniciar Sesión';
        document.getElementById("emp-sec-titulo").innerText = "Registro de Empresa";
        document.getElementById("lbl-emp-nom").innerText = "Nombre de la Empresa";
        document.getElementById("lbl-emp-centro").innerText = "Centro al que pertenecen";
        document.getElementById("lbl-emp-loc").innerText = "Localidad";
        document.getElementById("lbl-emp-tel").innerText = "Teléfono";
        document.getElementById("lbl-emp-email").innerText = "Correo Electrónico Corporativo";
        document.getElementById("lbl-emp-pass").innerText = "Contraseña";
        document.getElementById("lbl-emp-desc").innerText = "Pequeña Descripción de la Empresa";
        document.getElementById("lbl-emp-logo").innerText = "Adjuntar Imagen del Logotipo";
        document.getElementById("txt-emp-logo-tip").innerText = "Formatos admitidos: PNG, JPG, SVG.";
        document.getElementById("btn-submit-emp").innerHTML = '<i class="bi bi-building-check me-1"></i>Registrar Empresa e Iniciar Sesión';
      }
    }

    function cambiarIdioma() {
      idiomaActual = (idiomaActual === "es") ? "en" : "es";
      localStorage.setItem("idiomaSeleccionado", idiomaActual);
      aplicarTraduccion(idiomaActual);
    }

    aplicarTraduccion(idiomaActual);

    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo");
    if (tipo === "empresa") {
      const tabEmp = new bootstrap.Tab(document.getElementById("tab-empresa"));
      tabEmp.show();
    }

    function procesarRegistroUsuario(e) {
      e.preventDefault();
      const nombre = document.getElementById("user-nombre").value.trim();
      const correo = document.getElementById("user-correo").value.trim().toLowerCase();
      const pass = document.getElementById("user-password").value;
      const fotoInput = document.getElementById("user-foto");

      let usuarios = JSON.parse(localStorage.getItem("usuariosRegistrados") || "[]");
      const existe = usuarios.find(u => u.correo === correo);
      if (existe) {
        alert(idiomaActual === "es" ? "Ya existe una cuenta con este correo electrónico." : "An account with this email already exists.");
        return;
      }

      function guardar(fotoBase64) {
        const nuevoUsuario = {
          tipo: "usuario",
          nombre: nombre,
          correo: correo,
          password: pass,
          foto: fotoBase64 || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80"
        };
        usuarios.push(nuevoUsuario);
        localStorage.setItem("usuariosRegistrados", JSON.stringify(usuarios));
        localStorage.setItem("usuarioActual", JSON.stringify(nuevoUsuario));
        alert(idiomaActual === "es" ? "¡Registro completado con éxito! Bienvenido/a " + nombre : "Registration successful! Welcome " + nombre);
        window.location.href = "index.html";
      }

      if (fotoInput && fotoInput.files && fotoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          guardar(evt.target.result);
        };
        reader.readAsDataURL(fotoInput.files[0]);
      } else {
        guardar(null);
      }
    }

    function procesarRegistroEmpresa(e) {
      e.preventDefault();
      const nombre = document.getElementById("emp-nombre").value.trim();
      const centro = document.getElementById("emp-centro").value.trim();
      const localidad = document.getElementById("emp-localidad").value.trim();
      const telefono = document.getElementById("emp-telefono").value.trim();
      const correo = document.getElementById("emp-correo").value.trim().toLowerCase();
      const pass = document.getElementById("emp-password").value;
      const desc = document.getElementById("emp-desc").value.trim();
      const logoInput = document.getElementById("emp-logo");

      let usuarios = JSON.parse(localStorage.getItem("usuariosRegistrados") || "[]");
      const existe = usuarios.find(u => u.correo === correo);
      if (existe) {
        alert(idiomaActual === "es" ? "Ya existe una empresa registrada con este correo." : "A company with this email is already registered.");
        return;
      }

      function guardar(logoBase64) {
        const nuevaEmpresa = {
          tipo: "empresa",
          nombre: nombre,
          centro: centro,
          localidad: localidad,
          telefono: telefono,
          correo: correo,
          password: pass,
          descripcion: desc,
          foto: logoBase64 || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=200&q=80"
        };
        usuarios.push(nuevaEmpresa);
        localStorage.setItem("usuariosRegistrados", JSON.stringify(usuarios));
        localStorage.setItem("usuarioActual", JSON.stringify(nuevaEmpresa));
        alert(idiomaActual === "es" ? "¡Empresa registrada con éxito! Bienvenido/a " + nombre : "Company registered successfully! Welcome " + nombre);
        window.location.href = "index.html";
      }

      if (logoInput && logoInput.files && logoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          guardar(evt.target.result);
        };
        reader.readAsDataURL(logoInput.files[0]);
      } else {
        guardar(null);
      }
    }
  </script>
</body>
</html>
