<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Feria La Salle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="LaSalleCSS.CSS">
</head>
<body class="bg-light">

  <nav class="navbar bg-azul-primario py-3 border-bottom border-warning border-3">
    <div class="container">
      <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="login.html">
        <i class="bi bi-arrow-left me-2 text-amarillo"></i>Volver a Iniciar Sesión
      </a>
      <a href="LaSalle.HTML" class="btn btn-sm btn-azul-outline">Página Principal</a>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 750px;">

    <div class="card card-auth">
      <div class="card-auth-header text-center">
        <h3 class="fw-bold text-amarillo mb-1">Formulario de Registro</h3>
        <p class="text-light small mb-0">Selecciona el tipo de cuenta para unirte a la feria</p>
      </div>

      <div class="p-3 bg-light border-bottom">
        <ul class="nav nav-pills nav-fill nav-pills-amarillo" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active py-2" id="tab-usuario" data-bs-toggle="pill" data-bs-target="#panel-usuario" type="button" role="tab">
              <i class="bi bi-person me-2"></i>Usuario / Invitado
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link py-2" id="tab-empresa" data-bs-toggle="pill" data-bs-target="#panel-empresa" type="button" role="tab">
              <i class="bi bi-building me-2"></i>Empresa
            </button>
          </li>
        </ul>
      </div>

      <div class="card-body p-4 p-md-5">
        <div class="tab-content" id="pills-tabContent">

          <div class="tab-pane fade show active" id="panel-usuario" role="tabpanel">
            <h5 class="fw-bold text-primary mb-3">Registro de Usuario / Invitado</h5>
            <form id="form-usuario" onsubmit="event.preventDefault()">
              <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Nombre Completo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="user-nombre" placeholder="Tu nombre y apellidos">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="user-correo" placeholder="correo@ejemplo.com">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="user-password" placeholder="Mínimo 6 caracteres">
                </div>
              </div>

              <button type="submit" class="btn btn-amarillo w-100 py-3 fs-5 fw-bold">
                <i class="bi bi-check-lg me-1"></i>Registrarse
              </button>
            </form>
          </div>

          <div class="tab-pane fade" id="panel-empresa" role="tabpanel">
            <h5 class="fw-bold text-primary mb-3">Registro de Empresa</h5>
            <form id="form-empresa" onsubmit="event.preventDefault()">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary">Nombre de la Empresa</label>
                  <input type="text" class="form-control" id="emp-nombre" placeholder="Ej. Innova Solutions">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary">Centro al que pertenecen</label>
                  <input type="text" class="form-control" id="emp-centro" placeholder="Ej. Campus Barcelona / Sede Central">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary">Localidad</label>
                  <input type="text" class="form-control" id="emp-localidad" placeholder="Ej. Barcelona, Madrid...">
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label fw-bold text-secondary">Teléfono</label>
                  <input type="tel" class="form-control" id="emp-telefono" placeholder="Ej. +34 600 000 000">
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold text-secondary">Correo Electrónico Corporativo</label>
                  <input type="email" class="form-control" id="emp-correo" placeholder="contacto@empresa.com">
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold text-secondary">Pequeña Descripción de la Empresa</label>
                  <textarea class="form-control" id="emp-desc" rows="3" placeholder="Describe brevemente las actividades, proyectos o sector de la empresa..."></textarea>
                </div>

                <div class="col-12">
                  <label class="form-label fw-bold text-secondary">Adjuntar Imagen del Logotipo</label>
                  <input type="file" class="form-control" id="emp-logo" accept="image/*">
                  <small class="text-muted">Formatos admitidos: PNG, JPG, SVG.</small>
                </div>
              </div>

              <div class="mt-4">
                <button type="submit" class="btn btn-amarillo w-100 py-3 fs-5 fw-bold">
                  <i class="bi bi-building-check me-1"></i>Registrar Empresa
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tipo = params.get("tipo");
    if (tipo === "empresa") {
      const tabEmp = new bootstrap.Tab(document.getElementById("tab-empresa"));
      tabEmp.show();
    }
  </script>
</body>
</html>
